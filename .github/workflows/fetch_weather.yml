name: Fetch Seoul Weather Data # 서울 날씨 정보 수집

on: # 작업을 수행하는 조건
  schedule:
    - cron: "*/1 * * * *"  # "분 시 일 월 요일" -> /1 이런식으로 하면 1분마다 1일마다 이렇게 동작
  workflow_dispatch: # 수동으로 동작 가능 ❗
  push: # repository에 push가 일어난다면 동작하게 !
    branches:
      -main # 구체적으로 main에 push가 일어나면 !
jobs: # 실행할 작업을 정의
  fetch_weather: # 작업 이름
    runs-on: ubuntu-lastes # 우분투 최신버전

    steps: # 실행 동작 단계 설정
      - name: checkout storage
        uses: actions/checkout@v3 # 현재 github 저장소를 clone
        with: 
          token: ${{secrets.GITHUB_TOKEN}}
      - name: Python 설정
        uses: actions/setup-python@v4 # python 설치 플러그인 동작 !
        with: 
          python-version: "3.9"
      - name: install need package
        run: pip install requests # API 요청을 위한 라이브러리 설치
      - name: bring weather data
        env: # GITHUB secrets에서 환경 변수 가져오기
          OPENWEATHER_API_KEY: ${{secrets.OPENWEATHER_API_KEY}}
        run: python weather_script.py # 파이썬 스크립트를 실행
      - name: commit/push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add seoul_weather.csv # 날씨 데이터 저장 csv를 github에 추가
          git commit -m "Update weather data (auto)" # 변경 사항이 있을 때 commit
          git push # 변경 사항을 git에 push
          
